            - generic [ref=f2e319]:
              - strong [ref=f2e320]: "Observation window:"
              - text: 2026-09-23 to 2026-10-22 (30 days); 30 scored, 0 excluded as documented non-use, 0 with no prescribed dose.
              - strong [ref=f2e321]: "Timing window:"
              - text: ±60 minutes around the scheduled time.
              - strong [ref=f2e322]: "Repeat-actuation rule:"
              - text: IR triggers on the same compartment within 30 minutes count as one dose (0 collapsed in this window).
              - strong [ref=f2e323]: "Aggregation:"
              - text: each statistic is computed per day and then averaged across the window, with daily values capped at 100% — it is not pooled across the whole period.
              - strong [ref=f2e324]: "Method source:"
              - text: McGrady ME, Ramsey RR.
              - emphasis [ref=f2e325]: "Using Electronic Monitoring Devices to Assess Medication Adherence: a Research Methods Framework."
              - text: J Gen Intern Med. 2020;35(9):2707–2714. Taking and timing adherence are reported side by side because the choice of calculation method moves the headline figure by ~25 points on identical behaviour (Rohay & Dunbar-Jacob, Front Pharmacol. 2024;15:1460327). Full provenance in
              - code [ref=f2e326]: RESEARCH_BASIS.md
              - text: .
            - generic [ref=f2e327]:
              - strong [ref=f2e328]: "Risk model:"
              - text: L2-regularised logistic regression over 17 engineered features (adherence windows, miss streaks, slot/weekday history, timing drift, calendar position). Trained offline in Python on a temporal split (last 20% of days); only the frozen coefficients ship to the browser. Holdout AUC 0.68.
              - strong [ref=f2e329]: "Forecast:"
              - text: Holt linear-trend exponential smoothing (alpha 0.9, beta 0, selected on a held-out tail) projects the next 7 days; it is a projection, not recorded data.
              - strong [ref=f2e330]: "Calibration:"
              - text: intercept corrected to the observed base rate; real pilot data re-weights it at retrain once 20+ rows exist. Probabilities support—not replace—clinical judgement. Full model card in
              - code [ref=f2e331]: ml/model_card.md
              - text: .